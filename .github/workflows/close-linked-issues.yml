name: Close linked issues

# Auto-merge merges PRs as github-actions, and GitHub skips closing-keyword
# processing for GITHUB_TOKEN-attributed merges, so `Closes #n` never closed
# anything (#137). This scheduled job closes the issues GitHub links from PRs
# merged into main. Scheduled runs aren't affected by that GITHUB_TOKEN limit.
# Selection lives in scripts/close-linked-issues.mts: already-closed issues,
# cross-repo refs, and issues reopened after their PR merged are skipped, so a
# manual reopen sticks.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Look back this many days of merged PRs
        default: '3'
      dry_run:
        description: List issues that would close without closing them
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: close-linked-issues

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      DAYS: ${{ inputs.days || '3' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Close issues linked from merged PRs
        run: |
          if [ "$DRY_RUN" = true ]; then
            node scripts/close-linked-issues.mts --dry-run
          else
            node scripts/close-linked-issues.mts
          fi
