name: Bug
description: Something is broken or behaves wrongly.
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - App (Expo mobile)
        - Web (ossusarchives.com)
        - Admin (catalog tool)
        - Data (catalog, seed, pipelines)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs, error messages, device and OS version. Redact secrets.
  - type: checkboxes
    id: regression
    attributes:
      label: Fix requirements
      options:
        - label: The fix must include a regression test (required for tier:auto-merge)
