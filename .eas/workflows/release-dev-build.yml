# Phone build for native changes (docs/agents/releases.md "Weekly train").
# When a push to a release branch, or to main after a release merges, changes the iOS
# native fingerprint and no development-device build matches it, this asks for approval
# in expo.dev and then builds one. The owner installs it from expo.dev and tests the whole
# week's native work on it. Only one dev build fits on the phone: while the release-branch
# build is installed, pr-preview.yml previews of PRs into main won't open (reinstall main's
# build from expo.dev, or use the simulator).
# JS-only pushes find a matching build and do nothing. Builds use the EAS build quota,
# hence the approval: approve when you're ready to test, at most about once a day.
name: Release dev build

on:
  push:
    branches: ['main', 'feature/*-ios-*']

# Never cancel a running build (pushes to main land several times a day). Waiting runs
# collapse to the newest, which then finds the finished build and stops if nothing changed.
concurrency:
  group: release-dev-build-${{ github.ref }}

jobs:
  # Same environment as the development-device builds it looks for (EAS default: development).
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: development

  get_build:
    name: Find matching dev build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: development-device
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  approve:
    name: Build a new phone dev build?
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    type: require-approval

  build:
    name: Build development-device
    needs: [approve]
    type: build
    params:
      platform: ios
      profile: development-device
      message: 'Dev build for ${{ github.ref_name }} @ ${{ github.sha }}'
