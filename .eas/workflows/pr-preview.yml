# Phone previews for PRs labeled `device-review` (docs/agents/README.md "How to review").
# Publishes the PR head as an EAS update on an update branch named after the PR's git
# branch, then comments a QR on the PR that opens it in the owner's development-device
# build. Re-runs on every push to a labeled PR. Only JS changes can be previewed: if no
# dev build matches the PR's native fingerprint, it comments that instead and publishes
# nothing. pr-preview-cleanup.yml deletes the update branch when the git branch is deleted.
#
# Updates use the production environment (production Supabase, the owner's real account),
# like TestFlight. They go to an update branch named after the PR, never to the `production`
# channel, so store builds never receive them. PRs touching supabase/ aren't labeled
# (README "How to review"), since production doesn't have their schema yet.
name: PR device preview

on:
  pull_request_labeled:
    labels: ['device-review']
  pull_request:
    types: ['synchronize']
    if: ${{ contains(toJSON(github.event.pull_request.labels), '"device-review"') }}

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel_in_progress: true

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production

  get_build:
    name: Find matching dev build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: development-device
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  publish:
    name: Publish preview update
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    type: update
    environment: production
    params:
      platform: ios
      branch: ${{ github.event.pull_request.head.ref }}
      message: 'PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}'

  comment:
    name: Comment QR on PR
    needs: [publish]
    type: github-comment
    params:
      message: "📱 Expo preview for this PR's latest commit. Scan the QR with the iPhone Camera; it opens in the development build on production data, signed in as you. Re-published on every push."
      build_ids: []
      deployment_ids: []
      update_group_ids:
        - ${{ needs.publish.outputs.first_update_group_id }}

  no_match:
    name: Comment no matching build
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    type: github-comment
    params:
      payload: "📱 No phone preview: no development build matches this PR's native fingerprint. Either the PR changes native code (it needs a new build; review code and screenshots), or the dev build is behind `main` (approve the rebuild in expo.dev, then push again)."

  failed:
    name: Comment publish failure
    after: [publish]
    if: ${{ failure() }}
    type: github-comment
    params:
      payload: "📱 Phone preview failed to publish. See the PR device preview run in expo.dev. Push again to retry."
