# Deletes a PR preview's EAS update branch (pr-preview.yml) when its git branch is deleted.
# GitHub deletes branches on merge. A branch with no preview is a no-op. Runs from main's copy
# of this file.
name: PR device preview cleanup

on:
  ref_delete:
    branches: ['**', '!main', '!production']

jobs:
  delete_update_branch:
    name: Delete preview update branch
    type: branch-delete
    params:
      branch_name: ${{ github.ref_name }}
